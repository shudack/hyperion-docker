name: Build Docker Images

env:
  DOCKERHUB_TAG: "shudack/hyperion-ng"
  DOCKERHUB_SHORT_DESCRIPTION: "Unofficial Hyperion NG image for Hyperion-Project.org"
  DOCKERHUB_README_FILE: "README.md"

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push ${{ matrix.release_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        release_type:
          - stable
          - nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Should run?
        id: should_run
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          RELEASE_TYPE="${{ matrix.release_type }}"

          case "$EVENT" in
            push)
              if [[ "$RELEASE_TYPE" == "stable" ]]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              ;;

            schedule)
              if [[ "$RELEASE_TYPE" == "nightly" ]]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              elif [[ "$(date -u +%u)" == "5" ]]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              ;;

            workflow_dispatch)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup QEMU
        if: steps.should_run.outputs.run == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        if: steps.should_run.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.should_run.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Tags
        id: tags
        if: steps.should_run.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.release_type }}" == "nightly" ]]; then
            echo "tags=${{ env.DOCKERHUB_TAG }}:nightly" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Building temporary stable image to determine Hyperion version..."

          docker build \
            --build-arg RELEASE_TYPE=stable \
            --tag hyperion-temp:version \
            .

          VERSION="$(
            docker run --rm hyperion-temp:version \
              hyperiond --version |
              grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
              head -n 1
          )"

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not extract Hyperion version!"
            exit 1
          fi

          echo "Detected Hyperion version: $VERSION"

          {
            echo "tags<<EOF"
            echo "${{ env.DOCKERHUB_TAG }}:${VERSION}"
            echo "${{ env.DOCKERHUB_TAG }}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push
        if: steps.should_run.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            RELEASE_TYPE=${{ matrix.release_type }}
          tags: ${{ steps.tags.outputs.tags }}
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
          cache-from: type=gha,scope=${{ matrix.release_type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release_type }}
          sbom: true
          provenance: mode=max

  pushreadme:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    needs:
      - build

    if: >
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Docker Hub Description
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          destination_container_repo: ${{ env.DOCKERHUB_TAG }}
          provider: dockerhub
          short_description: ${{ env.DOCKERHUB_SHORT_DESCRIPTION }}
          readme_file: ${{ env.DOCKERHUB_README_FILE }}

  keepalive:
    name: Prevent Workflow Suspension
    runs-on: ubuntu-latest

    if: github.event_name == 'schedule'

    permissions:
      actions: write

    steps:
      - name: Keep workflow alive
        uses: liskin/gh-workflow-keepalive@v1
