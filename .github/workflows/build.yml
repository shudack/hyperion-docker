name: Build Docker Images

env:
  DOCKERHUB_TAG: "shudack/hyperion-ng"
  DOCKERHUB_SHORT_DESCRIPTION: "Unofficial Hyperion NG image for Hyperion-Project.org"
  DOCKERHUB_README_FILE: "README.md"
  HYPERION_REPOSITORY: "hyperion-project/hyperion.ng"

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if this Hyperion stable version already exists on Docker Hub"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for new Hyperion version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - name: Check Hyperion version
        id: check
        shell: bash
        env:
          FORCE: ${{ inputs.force }}

        run: |
          set -euo pipefail

          VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${HYPERION_REPOSITORY}/releases/latest" |
              jq -r '.tag_name' |
              sed 's/^v//'
          )"

          STATUS="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_TAG}/tags/${VERSION}"
          )"

          if [[ "$STATUS" == "200" && "$FORCE" != "true" ]]; then
            PUBLISH=false
          else
            PUBLISH=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

  build-stable:
    name: Build & Push stable
    runs-on: ubuntu-latest
    needs: check

    if: needs.check.outputs.publish == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            RELEASE_TYPE=stable
            HYPERION_VERSION=${{ needs.check.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_TAG }}:${{ needs.check.outputs.version }}
            ${{ env.DOCKERHUB_TAG }}:latest
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64

  build-nightly:
    name: Build & Push nightly
    runs-on: ubuntu-latest

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            RELEASE_TYPE=nightly
          tags: |
            ${{ env.DOCKERHUB_TAG }}:nightly
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64

  pushreadme:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    needs:
      - build-stable

    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Update Docker Hub Description
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          destination_container_repo: ${{ env.DOCKERHUB_TAG }}
          provider: dockerhub
          short_description: ${{ env.DOCKERHUB_SHORT_DESCRIPTION }}
          readme_file: ${{ env.DOCKERHUB_README_FILE }}

  keepalive:
    name: Prevent Workflow Suspension
    runs-on: ubuntu-latest
    
    if: github.event_name == 'schedule'
    
    permissions:
      actions: write

    steps:
      - name: Keep workflow alive
        uses: liskin/gh-workflow-keepalive@v1
